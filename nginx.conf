server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Client-side routing (react-router): serve index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
